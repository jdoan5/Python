# Local production-like run:
#   cd "Stage 4"
#   ANTHROPIC_API_KEY=sk-ant-... APP_PASSWORD=changeme docker compose up --build
#
# Or put both vars in "Stage 4/.env" (compose reads the .env next to this
# file — NOT the project-root .env). That file is dockerignored, so it can
# never be baked into the image.
#
# State persists in the named volume `job_agent_data` across rebuilds — the
# same volume name the `docker run` example in the Dockerfile uses.

services:
  portal:
    build:
      context: ..
      dockerfile: Stage 4/Dockerfile
    ports:
      # Loopback only — remove the 127.0.0.1 prefix to expose on your LAN.
      - "127.0.0.1:8501:8501"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell or Stage 4/.env}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in your shell or Stage 4/.env}
      # Your real inventory, copied onto the volume (see Dockerfile header):
      # JOB_AGENT_INVENTORY: /data/inventory.yaml   (already the image default)
    volumes:
      - job_agent_data:/data

volumes:
  job_agent_data:
    name: job_agent_data
