# RAG Eval Lab — golden set v2
#
# Questions about the FastAPI docs, each with graded judgments of which doc
# sections answer it. Grades: 2 = answers the question, 1 = related but not an
# answer, 0 = judged and rejected. The `rubric` key summarises them; the exact
# judging prompts are in golden/prompts/.
#
# Questions were written from seeded, stratified samples of sections (see
# `sampling`). Each question's judged sections come from pools: every section
# on its target page, and every section an evaluated configuration retrieved
# near the top. golden/README.md describes each version's pools. Edit by hand
# if you like, then run `python -m raglab golden validate`.

version: 2
corpus:
  ref: 0.165.0
  fingerprint: 3ec279619717c72441c0b92ad7e7244145ee857b7d070e5b0028cc4b3f364315
sampling:
  seed: 20261120
  sections: 100
  method: stratified by docs area in proportion to eligible sections (body >= 150 chars, excluding reference stubs
    and project-meta pages), at most 2 per page, ordered by sha256(seed:location); styles assigned round-robin in
    that order
rubric:
  '2': 'answers: a reader could resolve the question from this section alone'
  '1': 'related: on topic and useful context, but does not answer the question by itself'
  '0': 'not relevant: a different topic, or only shares words with the question'
